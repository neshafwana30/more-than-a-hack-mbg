# D1 experiment on F1: one optional contextual preparation evidence mechanism.
# Requires concurrent observed/reliable slow ball, low reliable motion in BOTH
# teams, adequate player coverage, and automatic set-piece context.
# Ten-frame trailing support (at 25 FPS: 0.4 s); >=80% support AND a current cue.
# No missing->dead, stationary-alone->dead, whole-tag->dead, or state latch.
# New contribution is released immediately when the current cue is invalid.
# Thresholds are a-priori hypotheses, not tuned on public GT or match labels.
# Existing 0.6 m/s stationary cutoff is reused; 1.5 m/s is an initial low-motion
# hypothesis. The bonus is bounded, not a calibrated probability.
# With default F1 weights, active support >=0.8 contributes >=0.44 to D;
# it can overcome the 0.30 prior gap only under the qualifying joint cues.
# All original evidence weights, live prior, control, fusion and decoder remain F1.
# Failure mode: quiet live play inside a broad automatic set-piece interval can
# satisfy this proxy. More D is not proof of improved possession accuracy.
version: 2
game: BAR-ATH
source: tactical
fps: 25
pitch: [105.3, 68.0]
quality:
  max_ball_speed_mps: 45.0
events:
  anchor_window_frames: 25
control:
  distance_scale_m: 2.5
  distance_weight: 1.0
  tag_weight: 0.30
  persistence_weight: 0.50
  margin_weight: 0.25
  proximity_window_frames: 11
  transition_window_frames: 9
live_dead:
  context_stoppage:
    enabled: true
    window_frames: 10
    minimum_support_fraction: 0.8
    stationary_ball_speed_mps: 0.6
    max_player_motion_mps: 1.5
    minimum_player_quality: 0.65
    weight: 0.55
  live_prior_score: 0.55
  dead_prior_score: 0.25
  ball_moving_live_weight: 0.22
  player_motion_live_weight: 0.12
  out_of_pitch_weight: 0.35
  stoppage_anchor_weight: 0.32
  restart_anchor_weight: 0.14
  stationary_near_anchor_weight: 0.12
fusion:
  control_normalization: max
  team_weight: 1.0
  live_weight: 1.0
  dead_weight: 1.0
  dead_bias: 0.0
  # FAQ-published second-half graded pre-kickoff interval: [110808,113742).
  second_half_kickoff_frame: 113742
temporal:
  ha_cost: 2.40
  hd_cost: 1.65
  dh_cost: 1.90
  turnover_discount: 0.80
  stoppage_discount: 0.70
  restart_discount: 0.70
  minimum_transition_cost: 0.05
  short_spell_scale_frames: 12
  short_spell_soft_penalty: 0.45
  second_half_kickoff_frame: 113742
boundary:
  search_radius_frames: 6
  minimum_quality_for_refine: 0.10
  event_anchor_bonus: 0.12
  boundary_shift_cost: 0.01
ambiguity:
  margin_threshold: 0.18
  window_radius_frames: 35
  max_windows: 40
  max_total_video_frames: 3000
video:
  enabled: false
  # Optional LOCAL pretrained COCO sports-ball detector weights; no download.
  local_yolo_weights: null
  video_frame_stride: 2
  max_reprojection_error: 2.0
  crop_padding_px: 180
  crop_position_age_frames: 20
  detector_min_confidence: 0.35
  max_video_ball_speed_mps: 45.0
